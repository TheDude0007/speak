name: Speak desktop (Windows + Linux)

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Speak-windows-x64
          - os: ubuntu-22.04
            artifact: Speak-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      SPEAK_MODELS_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xclip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Unit tests (shared logic, same cases as the Swift tests)
        run: python -m unittest discover -s tests -t .

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: models-parakeet-v3-int8-punct-en-2024-08-06

      - name: Download models
        run: python -m speak --download-models

      - name: Speech self-test (real audio, real model, this OS)
        run: |
          python -m speak --transcribe tests/fixtures/pauses.wav --realtime
          python -m speak --transcribe tests/fixtures/sample.wav

      - name: Build app (PyInstaller)
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --clean --name Speak --windowed \
            --collect-all sherpa_onnx --collect-submodules pystray --collect-submodules pynput \
            --collect-submodules keyring --hidden-import PIL._tkinter_finder \
            --icon assets/speak.ico \
            speak_entry.py

      - name: Self-test the packaged app
        shell: bash
        run: |
          EXE=dist/Speak/Speak; [ "$RUNNER_OS" = "Windows" ] && EXE=dist/Speak/Speak.exe
          SPEAK_SELFTEST_OUT=selftest.txt "$EXE" --transcribe tests/fixtures/pauses.wav
          cat selftest.txt
          grep -q "insert a period" selftest.txt

      - name: Package
        shell: bash
        run: |
          cp ../desktop/INSTALL.txt dist/Speak/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.artifact }}.zip Speak; else tar czf ../${{ matrix.artifact }}.tar.gz Speak; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/${{ matrix.artifact }}.*
